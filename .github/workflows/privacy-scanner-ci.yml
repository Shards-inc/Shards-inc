name: Privacy Scanner CI
on:
  push:
    paths:
      - 'privacy-scanner/**'
      - '.github/workflows/privacy-scanner-ci.yml'
  pull_request:
    paths:
      - 'privacy-scanner/**'
      - '.github/workflows/privacy-scanner-ci.yml'
permissions:
  contents: read
concurrency:
  group: privacy-scanner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: privacy-scanner/requirements.txt
      - run: python -m pip install -r privacy-scanner/requirements.txt pytest
      - run: PYTHONPATH=privacy-scanner python -m pytest -q privacy-scanner/tests/test_scanner.py
      - run: PYTHONPATH=privacy-scanner python -m compileall -q privacy-scanner
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check privacy-scanner/web/deep.js
      - run: node --check privacy-scanner/cloudflare/worker.js
      - name: Validate privacy gateway controls
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const worker=fs.readFileSync('privacy-scanner/cloudflare/worker.js','utf8');
          const html=fs.readFileSync('privacy-scanner/web/deep.html','utf8');
          const client=fs.readFileSync('privacy-scanner/web/deep.js','utf8');
          for(const marker of [
            'async function prunePrivacyRecords(',
            'async scheduled(event,env,ctx)',
            "identity_deep_results",
            "/api/identity/deep/complete",
            'shards_deep_session=',
          ]) assert.ok(worker.includes(marker), 'Missing live gateway control: '+marker);
          for(const marker of ['scanForm', 'username', 'consent', 'start', 'status', 'results'])
            assert.ok(html.includes('id="'+marker+'"'), 'Missing UI control: '+marker);
          assert.ok(client.includes("/api/identity/deep/start"));
          assert.ok(client.includes("/api/identity/deep/status"));
          assert.ok(!worker.includes('__e2estart/'),'Temporary acceptance route must not ship');
          JS