name: Shards Security crypto scanner smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/security-crypto-smoke.yml
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Exercise deployed Cloudflare Worker and real upstream data
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          from urllib.parse import urlencode
          BASE="https://security.shardsinc.co.uk"
          def request(path):
              req=urllib.request.Request(BASE+path, headers={"Accept":"application/json","User-Agent":"Shards-Security-Verification/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=28) as r:
                      return r.status,r.read(150000).decode('utf-8')
              except urllib.error.HTTPError as e:
                  return e.code,e.read(50000).decode("utf-8","replace")
          def check(name,success,info=""):
              print(("PASS" if success else "FAIL")+": "+name+" "+str(info)[:250])
              if not success:
                  raise SystemExit(1)
          status, body=request("/")
          check("homepage HTTP 200 and scanner present",status==200 and 'id="sc-scan"' in body and "PhishRisk" in body,status)
          status, body=request("/app.js")
          check("client javascript available",status==200 and "shards_crypto_watchlist_v1" in body,status)
          status, body=request("/api/status")
          check("existing status endpoint preserved",status==200 and json.loads(body).get("service")=="Shards Security",status)
          status, body=request("/api/crypto/token?chain=1&address=invalid")
          check("token input validation",status==400 and "error" in json.loads(body),status)
          status, body=request("/api/crypto/wallet?chain=solana&address=not-a-sol-address")
          check("wallet input validation",status==400 and "error" in json.loads(body),status)
          token_address="0x6b175474e89094c44da98b954eedeac495271d0f"
          status, body=request("/api/crypto/token?"+urlencode({"chain":"1","address":token_address}))
          print("TOKEN RESPONSE",status,body[:1200])
          token=json.loads(body)
          check("real Ethereum token scan",status==200 and token.get("kind")=="token" and token.get("verified_source_count",0)>0 and any(x.get("status")=="ok" for x in token.get("sources",{}).values()),token.get("risk"))
          status, body=request("/api/crypto/wallet?"+urlencode({"chain":"1","address":"0x000000000000000000000000000000000000dEaD"}))
          print("WALLET RESPONSE",status,body[:1200])
          wallet=json.loads(body)
          check("real wallet address scan",status==200 and wallet.get("kind")=="wallet" and wallet.get("verified_source_count",0)>0 and wallet.get("sources",{}).get("goplus",{}).get("status")=="ok",wallet.get("risk",wallet.get("error")))
          status, body=request("/api/crypto/token?"+urlencode({"chain":"solana","address":"So11111111111111111111111111111111111111112"}))
          print("SOLANA RESPONSE",status,body[:1700])
          sol=json.loads(body)
          check("real Solana token scan",status==200 and sol.get("kind")=="token" and sol.get("sources",{}).get("rugcheck",{}).get("status")=="ok" and sol.get("verified_source_count",0)>0,sol.get("risk",sol.get("error")))
          print("FULL E2E SMOKE: PASS")
          PY
      - name: Verify HTTPS enforcement on main and security domains
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          for host in ("shardsinc.co.uk","security.shardsinc.co.uk"):
              req=urllib.request.Request("http://"+host+"/",headers={"User-Agent":"Shards-Security-HTTPS-Audit/1.0"})
              try:
                  resp=opener.open(req,timeout=15)
              except urllib.error.HTTPError as e:
                  resp=e
              code=resp.status
              location=resp.headers.get("Location","")
              print(host,"HTTP",code,"Location:",location)
              assert code in (301,302,307,308) and location.startswith("https://"+host+"/"), "Missing HTTPS redirect for "+host
          print("HTTPS REDIRECTS: PASS")
          PY
      - name: Check deployed browser JavaScript syntax
        shell: bash
        run: |
          curl --fail --silent --show-error https://security.shardsinc.co.uk/app.js -o /tmp/shards-security-app.js
          node --check /tmp/shards-security-app.js
